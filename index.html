<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棋室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: a short title block over a single column of game rows, each row a link. */
:root {
  --bg: #e9e4da;
  --surface: #f6f2ea;
  --ink: #2a241c;
  --muted: #7a6d5c;
  --line: #cfc5b4;
  --accent: #a3361f;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "BiauKai", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1814; --surface: #26221c; --ink: #efe7da; --muted: #a59784;
    --line: #3d362c; --accent: #e0644a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1814; --surface: #26221c; --ink: #efe7da; --muted: #a59784;
  --line: #3d362c; --accent: #e0644a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
}
main {
  max-width: 520px;
  margin: 0 auto;
  padding-block: 48px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 28px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 40px;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 12px;
}
.seal {
  display: inline-grid; place-items: center;
  width: 40px; height: 40px;
  border: 2px solid var(--accent); border-radius: 5px;
  color: var(--accent); font-size: 22px; line-height: 1;
  transform: rotate(-4deg);
}
.lead { margin: 8px 0 0; color: var(--muted); }
nav { display: flex; flex-direction: column; gap: 12px; }
nav a {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: inherit;
  text-decoration: none;
}
nav a:hover { border-color: var(--accent); }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav svg { width: 56px; height: 56px; display: block; }
nav strong { font-family: var(--font-display); font-size: 22px; font-weight: 700; display: block; }
nav small { color: var(--muted); font-size: 13px; }
nav .go { color: var(--accent); font-size: 20px; }
footer { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div>
    <h1><span class="seal">棋</span>棋室</h1>
    <p class="lead">手機打開就能玩，可對電腦或和朋友同機對弈。</p>
  </div>
  <nav>
    <a href="gomoku/">
      <svg viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="8" fill="#d8a960"/>
        <g stroke="#4a3418" stroke-width="1"><path d="M8 8v40M20 8v40M32 8v40M44 8v40M8 8h40M8 20h40M8 32h40M8 44h40"/></g>
        <circle cx="20" cy="20" r="5" fill="#141414"/><circle cx="32" cy="32" r="5" fill="#141414"/><circle cx="44" cy="44" r="5" fill="#141414"/>
        <circle cx="32" cy="20" r="5" fill="#f3f0e9"/><circle cx="20" cy="32" r="5" fill="#f3f0e9"/>
      </svg>
      <span><strong>五子棋</strong><small>15 路棋盤，先連成五子者勝</small></span>
      <span class="go">›</span>
    </a>
    <a href="checkers/">
      <svg viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="8" fill="#d8a960"/>
        <path d="M28 4 34.5 16.7 49 16 41 28 49 40 34.5 39.3 28 52 21.5 39.3 7 40 15 28 7 16 21.5 16.7Z" fill="#c48c45"/>
        <circle cx="28" cy="12" r="4" fill="#2d6fd6"/><circle cx="28" cy="44" r="4" fill="#d23a2c"/>
        <circle cx="22" cy="40" r="4" fill="#d23a2c"/><circle cx="34" cy="40" r="4" fill="#d23a2c"/>
        <circle cx="22" cy="16" r="4" fill="#2d6fd6"/><circle cx="34" cy="16" r="4" fill="#2d6fd6"/>
      </svg>
      <span><strong>跳棋</strong><small>中國跳棋，2～6 人，連跳到對角</small></span>
      <span class="go">›</span>
    </a>
    <a href="mahjong/">
      <svg viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="8" fill="#2f6b55"/>
        <g transform="rotate(-8 28 28)">
          <rect x="8" y="14" width="19" height="27" rx="3" fill="#1d5a41"/><rect x="8" y="12" width="19" height="27" rx="3" fill="#f8f4ea"/>
          <text x="17.5" y="32" font-size="15" font-weight="700" text-anchor="middle" fill="#c0261b" font-family="serif">中</text>
        </g>
        <g transform="rotate(7 28 28)">
          <rect x="29" y="17" width="19" height="27" rx="3" fill="#1d5a41"/><rect x="29" y="15" width="19" height="27" rx="3" fill="#f8f4ea"/>
          <text x="38.5" y="35" font-size="15" font-weight="700" text-anchor="middle" fill="#1f7a45" font-family="serif">發</text>
        </g>
      </svg>
      <span><strong>台灣麻將</strong><small>十六張，對三家電腦，算台計分</small></span>
      <span class="go">›</span>
    </a>
    <a href="xiangqi/">
      <svg viewBox="0 0 56 56" aria-hidden="true">
        <rect width="56" height="56" rx="8" fill="#d8a960"/>
        <g stroke="#4a3418" stroke-width="1" fill="none"><path d="M6 10h44M6 22h44M6 34h44M6 46h44M6 10v36M50 10v36M17 10v12M28 10v12M39 10v12M17 34v12M28 34v12M39 34v12"/></g>
        <circle cx="17" cy="16" r="8" fill="#f3e2bd" stroke="#1d1d1d" stroke-width="1.5"/>
        <text x="17" y="20.5" font-size="11" font-weight="700" text-anchor="middle" fill="#1d1d1d" font-family="serif">將</text>
        <circle cx="39" cy="40" r="8" fill="#f3e2bd" stroke="#b5291c" stroke-width="1.5"/>
        <text x="39" y="44.5" font-size="11" font-weight="700" text-anchor="middle" fill="#b5291c" font-family="serif">帥</text>
      </svg>
      <span><strong>象棋</strong><small>大盤中國象棋，對電腦三種難度或雙人</small></span>
      <span class="go">›</span>
    </a>
  </nav>
  <footer>想把網頁像 App 一樣用：手機瀏覽器「分享 → 加入主畫面」。</footer>
</main>
</body>
</html>
